name: Native and authentication checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci
      - run: npm test
      - run: git diff --exit-code -- Server/server.mjs
      - name: Verify the exact three-file release
        run: |
          release_dir="$RUNNER_TEMP/guangyi-release"
          mkdir "$release_dir"
          cp Server/server.mjs Server/server.test.mjs "$release_dir/"
          printf '%040d\n' 0 > "$release_dir/REVISION"
          cd "$release_dir"
          node --test server.test.mjs
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 Scripts/validate_project.py
      - run: swift test
      - run: xcodebuild -project GuangyiWorkSpace.xcodeproj -scheme GuangyiWorkSpace-iOS -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/guangyi-ios CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project GuangyiWorkSpace.xcodeproj -scheme GuangyiWorkSpace-Mac -configuration Debug -destination 'platform=macOS' -derivedDataPath /tmp/guangyi-mac CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project GuangyiWorkSpace.xcodeproj -scheme WorkspaceCoreTests -destination 'platform=macOS' -derivedDataPath /tmp/guangyi-tests test
